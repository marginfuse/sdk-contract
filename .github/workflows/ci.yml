# Verifies the contract itself: that the harness compiles and that the data
# files are well formed. Verifying an SDK against the contract is the job of
# each SDK's own repository, which submodules this one.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install harness dependencies
        working-directory: harness
        run: npm install

      - name: Typecheck the harness
        working-directory: harness
        run: npm run typecheck

      - name: The contract files must be valid JSON
        run: |
          for f in openapi.json conformance/*.json; do
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              JSON.parse(readFileSync('$f', 'utf8'));
              console.log('ok  $f');
            "
          done

      - name: Every scenario must be complete
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { scenarios } = JSON.parse(readFileSync('conformance/behavior-scenarios.json', 'utf8'));
            const ids = new Set();
            for (const s of scenarios) {
              for (const k of ['id', 'name', 'server', 'action', 'params', 'expect']) {
                if (!(k in s)) throw new Error(\`scenario \${s.id ?? '?'} is missing \${k}\`);
              }
              if (typeof s.expect.throws !== 'boolean') throw new Error(\`\${s.id}: expect.throws must be a boolean\`);
              if (ids.has(s.id)) throw new Error(\`duplicate scenario id \${s.id}\`);
              ids.add(s.id);
            }
            console.log(\`ok  \${scenarios.length} scenarios\`);
          "
